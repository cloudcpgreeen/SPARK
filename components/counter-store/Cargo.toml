[package]
name = "counter-store"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
repository = "https://github.com/cloudcpgreeen/SPARK"
description = "SPARK P2 Capability Contract Spike：import spark:capability/storage 的 headless 计数器（同一 artifact 换 Host 实现，不重新编译）"

[lib]
crate-type = ["cdylib"]

[dependencies]
wit-bindgen-rt = "0.41"

[package.metadata.component]
package = "spark:store"

# cargo-component 不自动读 deps/：跨 package 依赖必须显式声明。
# deps/capability/capability.wit 是指向仓库根 wit/capability.wit 的 symlink。
[package.metadata.component.target.dependencies]
"spark:capability" = { path = "deps/capability" }

# 独立于根 workspace：仅由 `cargo component build` 构建，根 `cargo build`/`cargo test` 不触碰。
[workspace]
