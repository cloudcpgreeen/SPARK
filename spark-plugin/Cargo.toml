[package]
name = "spark-plugin"
version = "0.2.0"
edition = "2021"
license = "GPL-3.0-only"
repository = "https://github.com/cloudcpgreeen/SPARK"
description = "SPARK 示例插件：输入转大写（trap/err 前缀演示 panic 与声明式失败）"

[lib]
crate-type = ["cdylib"]

[dependencies]
wit-bindgen-rt = "0.41"

[package.metadata.component]
package = "spark:runtime"

# 独立于根 workspace：仅由 `cargo component build` 构建，根 `cargo build`/`cargo test` 不触碰。
[workspace]
